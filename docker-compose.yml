services:
  olcrtc-image:
    build:
      context: ./docker/olcrtc
    image: xfi-olcrtc:latest
    profiles: [build]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: xfi_olcrtc_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/xfi-olcrtc
      - /var/run/docker.sock:/var/run/docker.sock
      - ./database.sqlite:/app/database.sqlite
